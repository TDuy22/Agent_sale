[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interior-quote-backend"
version = "0.2.0"
description = "Finite-state sales assistant backend for kitchen consultation and quotation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
