# length_slot: slot chiều dài riêng; nếu khách chưa nói thì dùng kitchen_length_m.
# toggle_slot: slot boolean cho phép khách bỏ hạng mục (mặc định là có).
line_items:
  lower_cabinet:
    name: Tủ dưới
    length_slot: lower_cabinet_length_m
  upper_cabinet:
    name: Tủ trên
    length_slot: upper_cabinet_length_m
  countertop:
    name: Đá mặt bếp
    length_slot: countertop_length_m
    toggle_slot: include_countertop
  backsplash:
    name: Đá hoặc tấm ốp bếp
    length_slot: backsplash_length_m
    toggle_slot: include_backsplash
  led:
    name: LED, nguồn và cảm biến
    length_slot: led_length_m
    toggle_slot: include_led

