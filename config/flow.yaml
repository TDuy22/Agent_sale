sections:
  - id: project_info
    title: Thông tin công trình
    goal: Xác định khách xây mới hay cải tạo
    required_slots: [project_type]
    optional_slots: [location]
    max_attempts: 3
    failure_policy: needs_human

  - id: material
    title: Vật liệu
    goal: Xác định vật liệu tủ bếp
    required_slots: [material_code]
    optional_slots: []
    max_attempts: 3
    failure_policy: needs_human

  - id: dimensions
    title: Kích thước
    goal: Thu thập chiều dài cần thiết để tính giá
    required_slots: [kitchen_length_m]
    optional_slots:
      - lower_cabinet_length_m
      - upper_cabinet_length_m
      - countertop_length_m
      - backsplash_length_m
      - led_length_m
    max_attempts: 3
    failure_policy: needs_human

  - id: options
    title: Hạng mục bổ sung
    goal: Xác nhận đá, kính, LED, phụ kiện và thiết bị
    required_slots: []
    optional_slots:
      - include_countertop
      - include_backsplash
      - include_led
      - accessory_package
      - appliances
    defaults:
      include_countertop: true
      include_backsplash: true
      include_led: true
    max_attempts: 2
    failure_policy: use_defaults

  - id: quotation
    title: Báo giá
    goal: Tính và xác nhận báo giá
    required_slots: []
    optional_slots: []
    max_attempts: 1
    failure_policy: needs_human

