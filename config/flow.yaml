sections:
  - id: project_info
    title: Thông tin công trình
    goal: Xác định khách xây mới hay cải tạo
    required_slots: [project_type]
    optional_slots: [location]
    max_attempts: 3
    failure_policy: needs_human

  - id: material
    title: Vật liệu
    goal: Xác định vật liệu tủ bếp
    required_slots: [material_code]
    optional_slots: []
    suggested_assets: [kitchen_sample_combined]
    max_attempts: 3
    failure_policy: needs_human

  - id: dimensions
    title: Kích thước
    goal: Thu thập chiều dài cần thiết để tính giá
    required_slots: [kitchen_length_m]
    optional_slots:
      - lower_cabinet_length_m
      - upper_cabinet_length_m
      - countertop_length_m
      - backsplash_length_m
      - led_length_m
    max_attempts: 3
    failure_policy: needs_human

  - id: color
    title: Màu sắc
    goal: Xác định màu cánh tủ mong muốn
    required_slots: [color]
    optional_slots: []
    suggested_assets: [color_sample_combined]
    max_attempts: 3
    failure_policy: needs_human

  - id: quotation
    title: Báo giá
    goal: Tính và xác nhận báo giá
    required_slots: []
    optional_slots: []
    max_attempts: 1
    failure_policy: needs_human
