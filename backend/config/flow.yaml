greeting: >-
  Em chào anh/chị. Anh/chị đang xây mới hay cải tạo bếp, và đã chọn vật liệu nào chưa ạ?

# Nhãn dùng khi hỏi lại khách về slot còn thiếu.
slot_labels:
  project_type: công trình là xây mới hay cải tạo
  material_code: vật liệu tủ bếp mong muốn
  kitchen_length_m: chiều dài bếp (mét)
  lower_cabinet_length_m: chiều dài tủ dưới
  upper_cabinet_length_m: chiều dài tủ trên
  countertop_length_m: chiều dài đá mặt bếp
  backsplash_length_m: chiều dài phần ốp bếp
  led_length_m: chiều dài LED
  color: màu cánh tủ mong muốn

sections:
  - id: project_info
    title: Thông tin công trình
    goal: Xác định khách xây mới hay cải tạo
    required_slots: [project_type]
    optional_slots: [location]
    max_attempts: 3
    failure_policy: needs_human

  - id: material
    title: Vật liệu
    goal: Xác định vật liệu tủ bếp
    required_slots: [material_code]
    suggested_assets: [kitchen_sample_combined]
    max_attempts: 3
    failure_policy: needs_human

  - id: dimensions
    title: Kích thước
    goal: Thu thập chiều dài cần thiết để tính giá
    required_slots: [kitchen_length_m]
    optional_slots:
      - lower_cabinet_length_m
      - upper_cabinet_length_m
      - countertop_length_m
      - backsplash_length_m
      - led_length_m
    max_attempts: 3
    failure_policy: needs_human

  - id: color
    title: Màu sắc
    goal: Xác định màu cánh tủ mong muốn
    required_slots: [color]
    suggested_assets: [color_sample_combined]
    max_attempts: 3
    failure_policy: needs_human

  - id: quotation
    kind: quote
    title: Báo giá
    goal: Tính và xác nhận báo giá
